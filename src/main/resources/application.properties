spring.application.name=proyecto_spring_boot_Coworking

spring.datasource.url=jdbc:mysql://localhost:3306/coworkhub?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Natalita29
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Protege la API: página máxima de 50
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# No exponer detalles internos en los errores
server.error.include-stacktrace=never
server.error.include-message=never

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Configuracion JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000