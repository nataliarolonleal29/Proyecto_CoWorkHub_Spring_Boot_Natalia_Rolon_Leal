<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoWorkHub | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="login-page">

    <main class="login-container">
        <section class="login-brand">
            <div class="brand-icon">C</div>
            <h1>CoWorkHub</h1>
            <p>Tu espacio de trabajo, a tu manera.</p>
        </section>

        <section class="login-card">
            <h2>Bienvenido</h2>
            <p class="subtitle">Ingresa tus datos para continuar.</p>

            <form id="loginForm">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Ingresa tu usuario"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <button type="submit" class="btn-primary" id="loginButton">
                    Iniciar sesión
                </button>

                <p id="loginMessage" class="message"></p>
            </form>
        </section>

        <footer>2026 CoWorkHub. Todos los derechos reservados.</footer>
    </main>
</body>
</html>
